openapi: 3.0.3
info:
  title: TV Registration API
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /api/tv-options:
    get:
      summary: List TV options
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [SOUND, WALL, STORAGE, EXTENDED_WARRANTY]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TvOption'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/tv-options/{id}:
    get:
      summary: Get a TV option
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvOption'
        '404':
          description: Not found
  /api/tvs:
    get:
      summary: List TVs
      parameters:
        - in: query
          name: maker
          schema:
            type: string
            enum: [SONY, Panasonic, TOSHIBA, SHARP, LG, SAMSUNG]
        - in: query
          name: resolution
          schema:
            type: string
            enum: [HD, FullHD, 4K, 8K]
        - in: query
          name: panel
          schema:
            type: string
            enum: [LCD, OLED, MiniLED]
        - in: query
          name: has_hdr
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TvDetail'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    post:
      summary: Create TV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDetail'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/tvs/{id}:
    get:
      summary: Get TV
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDetail'
        '404':
          description: Not found
    put:
      summary: Update TV
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDetail'
        '404':
          description: Not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    patch:
      summary: Update TV (partial)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDetail'
        '404':
          description: Not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      summary: Delete TV
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content
components:
  schemas:
    TvOption:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [SOUND, WALL, STORAGE, EXTENDED_WARRANTY]
        code:
          type: string
        label:
          type: string
        price_yen:
          type: integer
        constraints:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, category, code, label, price_yen, created_at, updated_at]
    TvSelectedOption:
      type: object
      properties:
        tv_option_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 5
      required: [tv_option_id, quantity]
    TvSelectedOptionDetail:
      type: object
      properties:
        id:
          type: integer
        tv_option_id:
          type: integer
        quantity:
          type: integer
        tv_option:
          $ref: '#/components/schemas/TvOption'
      required: [id, tv_option_id, quantity, tv_option]
    Tv:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        maker:
          type: string
          enum: [SONY, Panasonic, TOSHIBA, SHARP, LG, SAMSUNG]
        inch:
          type: integer
          enum: [32, 43, 50, 55, 65, 75]
        resolution:
          type: string
          enum: [HD, FullHD, 4K, 8K]
        panel:
          type: string
          enum: [LCD, OLED, MiniLED]
        hdmi_ports:
          type: integer
          minimum: 1
          maximum: 6
        has_hdr:
          type: boolean
        has_wifi:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        [id, name, maker, inch, resolution, panel, hdmi_ports, has_hdr, has_wifi, created_at, updated_at]
    TvDetail:
      allOf:
        - $ref: '#/components/schemas/Tv'
        - type: object
          properties:
            selected_options:
              type: array
              items:
                $ref: '#/components/schemas/TvSelectedOptionDetail'
            total_price_yen:
              type: integer
          required: [selected_options, total_price_yen]
    TvInput:
      type: object
      properties:
        name:
          type: string
        maker:
          type: string
          enum: [SONY, Panasonic, TOSHIBA, SHARP, LG, SAMSUNG]
        inch:
          type: integer
          enum: [32, 43, 50, 55, 65, 75]
        resolution:
          type: string
          enum: [HD, FullHD, 4K, 8K]
        panel:
          type: string
          enum: [LCD, OLED, MiniLED]
        hdmi_ports:
          type: integer
          minimum: 1
          maximum: 6
        has_hdr:
          type: boolean
        has_wifi:
          type: boolean
        selected_options:
          type: array
          items:
            $ref: '#/components/schemas/TvSelectedOption'
      required: [name, maker, inch, resolution, panel, hdmi_ports, has_hdr, has_wifi]
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
      required: [message, errors]
